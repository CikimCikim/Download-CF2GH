name: Release Upload

on:
  repository_dispatch:
    types: [start_release]

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      URL:        ${{ github.event.client_payload.url }}
      CHAT_ID:    ${{ github.event.client_payload.tg_chat_id }}
      MSG_ID:     ${{ github.event.client_payload.tg_message_id }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      GH_TOKEN:   ${{ secrets.MY_GH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_GH_TOKEN }}
          fetch-depth: 1

      - name: Install tools
        run: sudo apt-get install -y aria2 jq ffmpeg

      - name: Record start time
        id: timing
        run: echo "STARTED_AT=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Get remote file size
        id: fileinfo
        run: |
          REMOTE_SIZE=$(curl -sIL "$URL" | grep -i content-length | tail -1 | grep -o '[0-9]*') || true
          [ -z "$REMOTE_SIZE" ] && REMOTE_SIZE=0
          if [ "$REMOTE_SIZE" -ge 104857600 ] 2>/dev/null; then
            POLL_INTERVAL=10
          else
            POLL_INTERVAL=4
          fi
          echo "REMOTE_SIZE=$REMOTE_SIZE" >> "$GITHUB_ENV"
          echo "POLL_INTERVAL=$POLL_INTERVAL" >> "$GITHUB_ENV"

      - name: Download File
        id: download
        run: |
          mkdir -p /tmp/download
          aria2c -x 16 -s 16 -k 1M --dir=/tmp/download "$URL"
          FILE_PATH=$(find /tmp/download -type f | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "❌ Download failed or no file found!" >&2
            exit 1
          fi
          echo "FILE_PATH=$FILE_PATH" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        run: |
          FILE_NAME=$(basename "$FILE_PATH")
          FILE_SIZE_BYTES=$(stat -c%s "$FILE_PATH")
          FILE_SIZE=$(numfmt --to=iec-standard "$FILE_SIZE_BYTES" 2>/dev/null || echo "$FILE_SIZE_BYTES B")
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "file_size=$FILE_SIZE" >> "$GITHUB_OUTPUT"
          echo "file_size_bytes=$FILE_SIZE_BYTES" >> "$GITHUB_OUTPUT"

      - name: Determine Type
        id: meta2
        run: |
          EXT="${FILE_PATH##*.}"
          EXT=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')
          case "$EXT" in
            mp4|mkv|avi|mov|wmv|webm|m4v|flv|ts|vob) TYPE="video" ;;
            mp3|flac|aac|wav|ogg|m4a|wma|opus) TYPE="audio" ;;
            jpg|jpeg|png|gif|webp|bmp|svg) TYPE="image" ;;
            *) TYPE="document" ;;
          esac
          echo "file_type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Tag
        id: rel_meta
        run: |
          TAG="rel-$(date +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        run: |
          TAG="${{ steps.rel_meta.outputs.tag }}"
          NAME="${{ steps.meta.outputs.file_name }}"
          
          RESPONSE=$(curl -s -X POST "https://api.github.com/repos/${{ github.repository }}/releases" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Release: $NAME\",\"body\":\"Automated release upload via Telegram Bot.\",\"draft\":false,\"prerelease\":false}")
          
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          RELEASE_URL=$(echo "$RESPONSE" | jq -r '.html_url')
          
          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "❌ Failed to create release!" >&2
            echo "$RESPONSE" >&2
            exit 1
          fi
          
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Process & Upload Asset
        run: |
          FILE_NAME="${{ steps.meta.outputs.file_name }}"
          SIZE_BYTES=${{ steps.meta.outputs.file_size_bytes }}
          RELEASE_ID="${{ steps.release.outputs.release_id }}"
          
          upload_asset() {
            local LOCAL_FILE="$1"
            local ASSET_NAME="$2"
            
            # استفاده از پایتون داخلی برای انکود مطمئن نام فایل در URL
            local ENCODED_NAME=$(echo "$ASSET_NAME" | python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip()))")
            
            curl -s -X POST "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$ENCODED_NAME" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$LOCAL_FILE" > /dev/null
          }

          notify_progress() {
            local PROG="$1"
            local UP_PARTS="$2"
            local TOT_PARTS="$3"
            
            # 🌟 تغییر نام رویداد به download_progress تا ورکر قفل نکند و لودینگ و زمان‌سنج حرکت کنند
            curl -s -o /dev/null -X POST "$WORKER_URL/webhook" \
              -H "Content-Type: application/json" \
              -d "{\n                \"event\": \"download_progress\",\n                \"data\": {\n                  \"chatId\": \"$CHAT_ID\",\n                  \"messageId\": \"$MSG_ID\",\n                  \"progress\": $PROG,\n                  \"speed\": \"Uploading to Release...\",\n                  \"downloaded\": \"Part $UP_PARTS\",\n                  \"total\": \"Total $TOT_PARTS\",\n                  \"startedAt\": \"${{ steps.timing.outputs.STARTED_AT }}\"\n                }\n              }"
          }

          if [ "$SIZE_BYTES" -lt 2147483648 ]; then
            notify_progress "50" "1" "1"
            upload_asset "$FILE_PATH" "$FILE_NAME"
            notify_progress "100" "1" "1"
          else
            # 🌟 همان کدهای لوپ کامل و تفکیک پارت‌های شما بدون حذف حتی یک کاراکتر
            mkdir -p /tmp/parts
            split -b 2000M "$FILE_PATH" /tmp/parts/part_
            
            TOTAL_PARTS=$(find /tmp/parts -type f | wc -l)
            UPLOADED=0
            
            for PART in $(ls /tmp/parts | sort); do
              UPLOADED=$(( UPLOADED + 1 ))
              PROGRESS=$(( UPLOADED * 100 / TOTAL_PARTS ))
              
              notify_progress "$PROGRESS" "$UPLOADED" "$TOTAL_PARTS"
              upload_asset "/tmp/parts/$PART" "${FILE_NAME}.${PART}"
            done
            
            notify_progress "100" "$TOTAL_PARTS" "$TOTAL_PARTS"
          fi

      - name: Notify completion
        run: |
          # 🌟 شبیه‌سازی ساختار درخواستی ورکر شما (download_completed) جهت فرستادن دکمه لینک مستقیم ریلیز
          RELEASE_URL="${{ steps.release.outputs.release_url }}"
          CUSTOM_TREE="[{\"type\":\"file\",\"name\":\"📦 CLICK HERE TO OPEN RELEASE PAGE\",\"url\":\"$RELEASE_URL\",\"size\":\"${{ steps.meta.outputs.file_size }}\",\"rawSize\":${{ steps.meta.outputs.file_size_bytes }}]\"
          
          curl -s -o /dev/null -X POST "$WORKER_URL/webhook" \
            -H "Content-Type: application/json" \
            -d "{\n              \"event\": \"download_completed\",\n              \"data\": {\n                \"chatId\": \"$CHAT_ID\",\n                \"messageId\": \"$MSG_ID\",\n                \"fileName\": \"${{ steps.meta.outputs.file_name }}\",\n                \"fileSize\": \"${{ steps.meta.outputs.file_size }}\",\n                \"folderTree\": $CUSTOM_TREE,\n                \"startedAt\": \"${{ steps.timing.outputs.STARTED_AT }}\"\n              }\n            }"

      - name: Notify failure
        if: failure()
        run: |
          # 🌟 هدایت خطا به رویداد اصلی ورکر شما جهت آزاد کردن صف تسک‌ها
          curl -s -o /dev/null -X POST "$WORKER_URL/webhook" \
            -H "Content-Type: application/json" \
            -d "{\n              \"event\": \"task_failed\",\n              \"data\": {\n                \"chatId\": \"$CHAT_ID\",\n                \"messageId\": \"$MSG_ID\",\n                \"reason\": \"GitHub Actions Release Upload workflow failed. Check actions tab.\",\n                \"startedAt\": \"${{ steps.timing.outputs.STARTED_AT }}\"\n              }\n            }"
